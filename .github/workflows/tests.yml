name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: pytest
      - run: python experiments/calibration.py --start 1 --stop 32 --root "$RUNNER_TEMP/cdm-calibration" --repository-commit "$GITHUB_SHA"
