[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collatz-divergence-machine"
version = "0.1.0"
description = "Bounded multi-stage infrastructure for research on unbounded Collatz orbits"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "John Fairfax-Ball"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
